# =====================================================================
# frontend/nginx.conf
# الهدف: إعدادات خادم الويب Nginx داخل حاوية الواجهة الأمامية.
#
# المسؤولية:
#   - عرض ملفات الواجهة الأمامية (React).
#   - توجيه أي رابط داخلي (مثل /committees) إلى index.html، وهو بديل
#     vercel.json و.htaccess.
#   - تمرير طلبات /api و/socket.io و/health إلى حاوية الخادم الخلفي.
#   - دعم اتصالات WebSocket للتحديثات اللحظية في الاجتماعات والمحاضر.
#   - HTTPS على المنفذ 443 بشهادة بارع (certbot على السيرفر)، والمنفذ 80
#     يحوّل للـHTTPS ما عدا تحقق تجديد الشهادة و/health لسكربت النشر.
# =====================================================================

# المنفذ 80 (HTTP): تجديد الشهادة، وفحص /health لسكربت النشر، وتحويل الباقي إلى HTTPS.
server {
    listen 80;
    server_name _;

    # تحقق Let's Encrypt عند تجديد الشهادة (certbot --webroot على السيرفر).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # deploy/deploy.sh يفحص http://localhost/health، فيبقى بدون تحويل حتى يكشف
    # فعلاً لو الخادم الخلفي واقف (curl -f لا يعتبر التحويل 301 فشلاً).
    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        return 301 https://cms.wadimakkah.sa$request_uri;
    }
}

# المنفذ 443 (HTTPS): النظام نفسه.
server {
    listen 443 ssl;
    server_name _;

    # الشهادة اللي أصدرها بارع على السيرفر (certbot)، مركّبة من /etc/letsencrypt للقراءة فقط.
    ssl_certificate     /etc/letsencrypt/live/cms.wadimakkah.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.wadimakkah.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # الحد الأعلى للملف الواحد في النظام 25 ميجابايت؛ مع هامش للبيانات المرافقة.
    client_max_body_size 30m;

    # الواجهات البرمجية للخادم الخلفي.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # طلبات الذكاء الاصطناعي (تلخيص المحاضر) قد تستغرق وقتاً أطول.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # التحديثات اللحظية (Socket.IO عبر WebSocket).
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # فحص حالة الخادم الخلفي.
    location = /health {
        proxy_pass http://backend:8000;
    }

    # صفحات الواجهة: أي رابط غير موجود كملف يُوجَّه إلى index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
