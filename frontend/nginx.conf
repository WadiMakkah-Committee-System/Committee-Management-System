# =====================================================================
# frontend/nginx.conf
# الهدف: إعدادات خادم الويب Nginx داخل حاوية الواجهة الأمامية.
#
# المسؤولية:
#   - عرض ملفات الواجهة الأمامية (React).
#   - توجيه أي رابط داخلي (مثل /committees) إلى index.html، وهو بديل
#     vercel.json و.htaccess.
#   - تمرير طلبات /api و/socket.io و/health إلى حاوية الخادم الخلفي.
#   - دعم اتصالات WebSocket للتحديثات اللحظية في الاجتماعات والمحاضر.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # الحد الأعلى للملف الواحد في النظام 25 ميجابايت؛ مع هامش للبيانات المرافقة.
    client_max_body_size 30m;

    # الواجهات البرمجية للخادم الخلفي.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # طلبات الذكاء الاصطناعي (تلخيص المحاضر) قد تستغرق وقتاً أطول.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # التحديثات اللحظية (Socket.IO عبر WebSocket).
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # فحص حالة الخادم الخلفي.
    location = /health {
        proxy_pass http://backend:8000;
    }

    # صفحات الواجهة: أي رابط غير موجود كملف يُوجَّه إلى index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
