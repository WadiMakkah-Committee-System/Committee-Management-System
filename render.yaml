services:
  - type: web
    name: committee-backend-fra
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # 2026-09-13 (قرار لاما): استبدال Render Key Value (Redis) بـDragonfly
      # Cloud (خدمة مُدارة خارجية) — نفس بروتوكول Redis (RESP)، والعميل هنا
      # (redis.asyncio.from_url في app/core/redis_client.py) يعمل بلا أي
      # تعديل كود، وكل الأوامر المستخدَمة فعليًا بالمشروع (SET/EXPIRE/
      # EXISTS/DELETE/GET) مدعومة بالكامل من Dragonfly. بما إنها خدمة
      # خارجية (مو Render Key Value)، ما تقدر تُربَط عبر fromService —
      # القيمة تُدخَل يدويًا من لوحة Render (Environment) بعد إنشاء
      # قاعدة Dragonfly Cloud ونسخ رابط الاتصال منها (عادة rediss://...).
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://committee-management-system-murex.vercel.app

# خدمة committee-redis-fra (Render Key Value) أُزيلت من هنا بعد التبديل
# لـDragonfly Cloud. لا تُحذف تلقائيًا بمجرد إزالتها من هذا الملف — احذفيها
# يدويًا من لوحة Render بعد ما تتأكدين إن Dragonfly شغّال تمام، لتفادي فقدان
# أي جلسات نشطة لو حصل خطأ بمنتصف التبديل.
